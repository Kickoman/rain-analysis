name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Same interpreter the deploy job uses. Testing on 3.10 while publishing
        # on 3.11 meant the code that builds the site was never run under the
        # version that builds the site.
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: pip install -r requirements.txt

    # One run, with coverage. It used to run twice — once plain, once with
    # --cov — for a suite that finishes in a few seconds either way.
    - name: Run tests
      run: python -m pytest tests/ --tb=short --cov=analysis --cov=scripts_utils --cov-report=term-missing
