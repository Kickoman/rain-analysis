[pytest]
# The repo carries two independent test suites:
#   * root:    pytest tests/            (analysis + scripts_utils)
#   * backend: cd backend && pytest     (needs backend/pytest.ini asyncio_mode)
# A bare `pytest` from the root must not mix them — backend tests only work
# with backend/pytest.ini applied, which requires running from backend/ (#441).
testpaths = tests
norecursedirs = backend .venv
